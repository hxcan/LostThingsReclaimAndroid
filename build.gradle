// Top-level build file
// LostThingsReclaimAndroid - 失物招领平台 Android 客户端

buildscript {
    ext {
        kotlin_version = '1.9.22'
        agp_version = '8.2.2'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        // ✅ 添加 JitPack 仓库，用于解析 com.github.hxcan:* 依赖
        // android-crash-detector 等自家库通过 JitPack 分发
        maven { url "https://jitpack.io" }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}